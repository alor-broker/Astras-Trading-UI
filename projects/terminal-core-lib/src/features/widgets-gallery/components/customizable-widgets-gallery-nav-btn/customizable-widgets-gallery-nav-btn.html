<ng-container *transloco="let tDesktop; scope: 'dashboard/navbar/desktop'">
  @let isDashboardLocked = (currentDashboard$ | async)?.isLocked ?? false;
  <button
    (click)="galleryVisible.set(true)"
    [disabled]="atsDisabled() || isDashboardLocked"
    [nz-tooltip]="isDashboardLocked ? tDesktop('dashboardNavbarDesktop.dashboardLockedTooltip') : ''"
    nz-button
    nzType="text"
  >
    <i [nzRotate]="-90" nz-icon nzTheme="outline" nzType="appstore-add"></i>
    {{ tDesktop("dashboardNavbarDesktop.widgetsLabel") }}
  </button>
</ng-container>

@let context = galleryContext$ | async;
@if (context) {
  <ats-customizable-widgets-gallery [(atsVisible)]="galleryVisible"
    [widgets]="context.widgets" [language]="context.language" [dashboardType]="context.dashboardType"
    [disabled]="atsDisabled() || ((currentDashboard$ | async)?.isLocked ?? false)"
    (selected)="addWidget($event)" (resetDashboard)="resetDashboard()"/>
}
