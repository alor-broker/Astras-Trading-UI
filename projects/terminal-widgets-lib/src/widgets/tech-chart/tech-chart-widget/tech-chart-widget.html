<ng-container *transloco="let t;">
  @if (settings$ | async; as settings) {
    <ats-widget-skeleton
      [isBlockWidget]="isBlockWidget()"
      [settingsEditor]="settingsEditor"
      [showContentScroll]="false"
    >
      <ng-container atsWidgetHeader>
        <ats-widget-header (switchSettings)="settingsEditor.openSettings($event)"
                           [guid]="guid"
                           [hasSettings]="true"
                           [linkToActive]="settings.linkToActive ?? null"
                           [selectedBadgeColor]="settings.badgeColor"
                           [showBadgesMenu]="(showBadge$ | async) ?? false"
                           [titleTemplate]="titleTemplate"
                           [widgetMeta]="widgetInstance().widgetMeta"
        />
        <ng-template #titleTemplate>
          <ats-widget-header-instrument-switch [customTitle]="headerTitle$ | async"
                                               [widgetGuid]="widgetInstance().instance.guid"
          />
        </ng-template>
      </ng-container>
      <ng-container atsWidgetContent>
        <ats-tech-chart [guid]="guid"/>
      </ng-container>

      <ats-tech-chart-settings
        #settingsEditor
        [guid]="guid"
        [widgetInstance]="widgetInstance()"
        atsWidgetSettingsEditor
      />
    </ats-widget-skeleton>
  }

</ng-container>
