<ats-widget-settings-editor
  (cancelClick)="requestClose()"
  (copyClick)="createWidgetCopy()"
  (saveClick)="updateSettings()"
  [canCopy]="canCopy"
  [canSave]="canSave"
  [showCopy]="showCopy"
  [widgetInstance]="widgetInstance()"
>
  <ng-container *transloco="let t; scope: 'ai-signals/settings'">
    <ats-widget-settings-form [formGroup]="form">
      <ats-widget-settings-form-item
        [label]="t('aiSignalsSettings.refreshIntervalSecLabel')"
        [required]="true"
      >
        <nz-slider
          [nzMarks]="marks"
          [nzMax]="validationOptions.refreshIntervalSec.max"
          [nzMin]="validationOptions.refreshIntervalSec.min"
          [nzStep]="1"
          formControlName="refreshIntervalSec"
        />
      </ats-widget-settings-form-item>
    </ats-widget-settings-form>
  </ng-container>
</ats-widget-settings-editor>
