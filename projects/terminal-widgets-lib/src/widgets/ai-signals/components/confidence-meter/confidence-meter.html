<div [attr.aria-valuemax]="maxConfidence"
     [attr.aria-valuemin]="0"
     [attr.aria-valuenow]="confidence()"
     class="meter"
     role="meter"
>
  <div [class.bearish]="direction() === directions.Bearish"
       [class.bullish]="direction() === directions.Bullish"
       [class.neutral]="direction() === null || direction() === directions.Neutral"
       [style.width.%]="fillPercent()"
       class="fill"
  ></div>
</div>
