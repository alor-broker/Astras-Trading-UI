<ats-widget-settings-editor
  (cancelClick)="requestClose()"
  (copyClick)="createWidgetCopy()"
  (saveClick)="updateSettings()"
  [canCopy]="canCopy"
  [canSave]="canSave"
  [showCopy]="showCopy"
  [widgetInstance]="widgetInstance()"
>
  <ng-container *transloco="let t">
    <ats-widget-settings-form [formGroup]="form">
      <ats-widget-settings-form-item
        *transloco="let tSettings; scope: 'all-instruments/all-instruments-settings'"
        [errorTip]="tSettings('allInstrumentsAllInstrumentsSettings.selectColumnsError')"
        [label]="tSettings('allInstrumentsAllInstrumentsSettings.selectColumnLabel')"
        [required]="true"
      >
        <nz-select
          [nzMaxTagCount]="10"
          [nzMaxTagPlaceholder]="tagPlaceHolder"
          [nzPlaceHolder]="tSettings('allInstrumentsAllInstrumentsSettings.selectColumnPlaceholder')"
          formControlName="allInstrumentsColumns"
          nzMode="multiple"
        >
          <ng-container *transloco="let tInstruments; scope: 'all-instruments/all-instruments'">
            @for (item of allInstrumentsColumns; track item.id) {
              <nz-option
                [nzLabel]="tInstruments('allInstrumentsAllInstruments.columns.' + item.id + '.name')"
                [nzValue]="item.id"
              />
            }
          </ng-container>
        </nz-select>
      </ats-widget-settings-form-item>
    </ats-widget-settings-form>

    <ng-template #tagPlaceHolder let-selectedList>{{ t('maxTagPlaceholder', {count: selectedList.length}) }}</ng-template>
  </ng-container>
</ats-widget-settings-editor>
