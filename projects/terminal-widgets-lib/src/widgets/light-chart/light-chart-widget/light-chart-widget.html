<ng-container *transloco="let t;">
  @if (settings$ | async; as widgetSettings) {
    <ats-widget-skeleton
      #widgetSkeleton
      [content]="contentRef"
      [header]="headerRef"
      [isBlockWidget]="isBlockWidget()"
      [settingsEditorContent]="settingsEditorRef"
      [showContentScroll]="false"
    >
      <ng-template #headerRef>
        <ats-widget-header (switchSettings)="widgetSkeleton.toggleSettings()"
                           [guid]="guid"
                           [hasSettings]="true"
                           [linkToActive]="widgetSettings.linkToActive ?? null"
                           [selectedBadgeColor]="widgetSettings.badgeColor"
                           [showBadgesMenu]="(showBadge$ | async) ?? false"
                           [titleTemplate]="titleTemplate"
                           [widgetMeta]="widgetInstance().widgetMeta"
        />
        <ng-template #titleTemplate>
          <ats-widget-header-instrument-switch [widgetGuid]="guid"/>
        </ng-template>
      </ng-template>
      <ng-template #contentRef>
        @if (chartSettings$ | async; as chartSettings) {
          <ats-light-chart
            (selectedTimeframeChange)="updateSelectedTimeFrame($event)"
            [selectedTimeframe]="widgetSettings.timeFrame"
            [settings]="chartSettings"
          />
        }
      </ng-template>
      <ng-template #settingsEditorRef>
        <ats-light-chart-settings
          (closeRequested)="widgetSkeleton.closeSettings()"
          [guid]="guid"
          [widgetInstance]="widgetInstance()"
        />
      </ng-template>
    </ats-widget-skeleton>
  }
</ng-container>
