<ng-container *transloco="let t; scope: 'invest-ideas'">
  <div *ngrxLet="ideas$ as ideas; suspenseTpl: loading">
    @if (ideas.length > 0) {
      <nz-carousel [nzDots]="true">
        @for (idea of ideas; track idea) {
          <div class="p-5" nz-carousel-content>
            <div (click)="openIdea(idea)" class="idea">
              <div class="mb-10">
                <span class="fs-6 heading-color" nz-typography nzEllipsis>{{ idea.title }}</span>
              </div>

              @if (idea.format === IdeaResponseFormat.HtmlBody) {
                <div>
                  <p [nzEllipsisRows]="8" nz-typography nzEllipsis>{{ idea.body }}</p>
                </div>
              } @else {
                <div>
                  <ats-idea-metrics [idea]="idea"/>
                </div>
                <div
                  class="d-flex flex-row justify-content-start flex-nowrap align-items-center flex-gap-5 overflow-hidden">
                  <ats-instrument-icon [symbol]="idea.ticker" size="large"/>
                  <div class="d-flex flex-column overflow-hidden">
                          <span
                            class="heading-color"
                            nz-typography
                            nzEllipsis>{{ idea.company }}</span>
                    <span nz-typography nzEllipsis>{{ idea.ticker }}</span>
                  </div>
                </div>
              }

            </div>
          </div>
        }
      </nz-carousel>
    } @else {
      <nz-empty [nzNotFoundContent]="t('investIdeas.noItemsToDisplayMessage')" nzNotFoundImage="simple"/>
    }
  </div>

  <ng-template #loading>
    <nz-skeleton [nzActive]="true" [nzParagraph]="{ rows: 5, width: '100%' }"/>
  </ng-template>

  <ats-idea-details [(displayIdea)]="selectedIdea"/>
</ng-container>
