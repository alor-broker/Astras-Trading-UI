<ng-container>
  @if (settings$ | async; as settings) {
    <ats-widget-skeleton
      [content]="contentRef"
      [header]="headerRef"
      [isBlockWidget]="isBlockWidget()"
      [settings]="settingsRef"
      [showContentScroll]="true"
      [showSettings]="showSettings()"
    >
      <ng-template #headerRef>
        <ats-widget-header (switchSettings)="toggleSettings()"
                           [badgeShape]="'square'"
                           [guid]="guid"
                           [hasSettings]="true"
                           [selectedBadgeColor]="settings.badgeColor"
                           [showBadgesMenu]="(showBadge$ | async) ?? false"
                           [widgetMeta]="widgetInstance().widgetMeta"
        />
      </ng-template>
      <ng-template #contentRef>
        <ats-market-trends (instrumentSelected)="selectInstrument($event)"
                           [extendedFilter]="settings.extendedFilter"
                           [fixedHeader]="true"
                           [itemsCount]="settings.itemsCount"
                           [marketFilters]="{
        targetMarkets: $safeNavigationMigration(settings.marketFilters?.targetMarkets),
        ignoredBoards: $safeNavigationMigration(settings.marketFilters?.ignoredBoards),
        instrumentTypes: $safeNavigationMigration(settings.marketFilters?.instrumentTypes),
        minTradeAmount: $safeNavigationMigration(settings.marketFilters?.minTradeAmount),
        minCapitalization: $safeNavigationMigration(settings.marketFilters?.minCapitalization)
        }"
                           [sectors]="settings.displaySectors"
                           [showMoreButton]="false"
        />
      </ng-template>
      <ng-template #settingsRef>
        <ats-market-trends-settings (settingsChange)="toggleSettings()" [guid]="guid"/>
      </ng-template>
    </ats-widget-skeleton>
  }

</ng-container>
