<ats-widget-settings-editor
  (cancelClick)="requestClose()"
  (copyClick)="createWidgetCopy()"
  (saveClick)="updateSettings()"
  [canCopy]="canCopy"
  [canSave]="canSave"
  [showCopy]="showCopy"
  [widgetInstance]="widgetInstance()"
>
  <ng-container *transloco="let t; scope: 'bond-screener/settings'">
    <ats-widget-settings-form [formGroup]="form">
      <ats-widget-settings-form-item
        [errorTip]="t('validationErrors.selectColumnsError')"
        [label]="t('form.tableColumns.selectColumnLabel')"
        [required]="true"
      >
        <nz-select
          [nzMaxTagCount]="10"
          [nzMaxTagPlaceholder]="tagPlaceHolder"
          [nzPlaceHolder]="t('form.tableColumns.selectColumnLabel')"
          formControlName="bondScreenerColumns"
          nzMode="multiple"
        >
          <ng-container *transloco="let tBondScreener; scope: 'bond-screener/bond-screener'">
            @for (item of bondScreenerColumns; track item.id) {
              <nz-option [nzLabel]="tBondScreener('bondScreenerBondScreener.columns.' + item.id)"
                         [nzValue]="item.id"
              />
            }
          </ng-container>
        </nz-select>
      </ats-widget-settings-form-item>

      <ats-widget-settings-switch
        [label]="t('bondScreenerSettings.hideExpired')"
        formControlName="hideExpired"
      />
    </ats-widget-settings-form>

    <ng-template #tagPlaceHolder let-selectedList>{{ t('maxTagPlaceholder', {count: selectedList.length}) }}
    </ng-template>
  </ng-container>
</ats-widget-settings-editor>
