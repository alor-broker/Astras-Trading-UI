<ng-container *transloco="let t; scope: 'shared/widget-settings'">
  <nav class="nav">
    @for (group of groups(); track group.groupId()) {
      @let isActive = activeGroup() === group;
      @let isBlocked = !canLeaveCurrent() && !isActive;
      <button
        (click)="selectGroup(group)"
        [attr.aria-disabled]="isBlocked"
        [class.active]="isActive"
        [class.disabled]="isBlocked"
        [nzTooltipTitle]="isBlocked ? t('sharedWidgetSettings.invalidGroupTooltip') : ''"
        class="nav-item"
        nz-tooltip
        nzTooltipPlacement="right"
        type="button"
      >
        <span class="nav-title">{{ group.title() }}</span>
        @if (!group.isValid()) {
          <span
            class="nav-invalid"
            nz-icon
            nzTheme="outline"
            nzType="exclamation-circle"
          ></span>
        }
      </button>
    }
  </nav>

  <div class="fields">
    @if (activeGroup(); as group) {
      <ng-container *ngTemplateOutlet="group.fieldsTpl()"/>
    }
  </div>
</ng-container>
