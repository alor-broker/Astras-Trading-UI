<div class="widget-header">
  @if (projectedHeader()) {
    <ng-content select="[atsWidgetHeader]"/>
  } @else if (header(); as headerTpl) {
    <ng-container *ngTemplateOutlet="headerTpl"/>
  }
</div>
@if (isBlockWidget()) {
  <div class="blocked-widget-overlay"></div>
}

@if (inlineSettings(); as settingsEl) {
  <div (mousedown)="$event.stopPropagation()" class="widget-content show-scroll">
    <ng-container *ngTemplateOutlet="settingsEl"/>
  </div>
} @else {
  <div
    (mousedown)="$event.stopPropagation()"
    [class.hidden]="shouldHideWidgetContent()"
    [class.hide-scroll]="!showContentScroll()"
    [class.show-scroll]="showContentScroll()"
    class="widget-content widget-main-content"
  >
    @if (projectedContent()) {
      <ng-content select="[atsWidgetContent]"/>
    } @else if (content(); as contentTpl) {
      <ng-container *ngTemplateOutlet="contentTpl"/>
    }
  </div>

  <div
    (mousedown)="$event.stopPropagation()"
    [class.hidden]="!shouldHideWidgetContent()"
    class="widget-content show-scroll widget-settings-editor-content"
  >
    <ng-content select="[atsWidgetSettingsEditor]"/>
  </div>
}
