<div class="widget-header">
  <ng-container *ngTemplateOutlet="header()"/>
</div>
@if (isBlockWidget()) {
  <div class="blocked-widget-overlay"></div>
}

@if (inlineSettings(); as settingsEl) {
  <div (mousedown)="$event.stopPropagation()" class="widget-content show-scroll">
    <ng-container *ngTemplateOutlet="settingsEl"/>
  </div>
} @else if (showPlaceholder()) {
  <div *transloco="let t; scope: 'shared/widget-settings'" class="widget-content widget-editing-placeholder">
    <span class="widget-editing-placeholder__icon" nz-icon nzTheme="outline" nzType="setting"></span>
    <span class="widget-editing-placeholder__text">{{ t('sharedWidgetSettings.editingContentPlaceholder') }}</span>
  </div>
} @else {
  <div (mousedown)="$event.stopPropagation()"
       [class]="{'show-scroll': showContentScroll(), 'hide-scroll': !showContentScroll()}"
       class="widget-content">
    <ng-container *ngTemplateOutlet="content()"/>
  </div>
}
